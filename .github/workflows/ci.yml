name: CI

on:
  push:
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Qt system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libegl1 libgl1 libxkbcommon-x11-0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
          libxcb-shape0 libxcb-sync1 libxcb-randr0 libxcb-xkb1 \
          libxcb-util1 libxrender1 libxcomposite1 libxcursor1 \
          libxi6 libxtst6 mesa-utils xvfb

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install .[test]

    - name: Execute Full Automated Test Suite
      run: xvfb-run -a pytest -v
